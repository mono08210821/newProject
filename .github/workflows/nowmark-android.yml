name: Nowmark Android

on:
  push:
    paths: ["nowmark/**", ".github/workflows/nowmark-android.yml"]
  pull_request:
    paths: ["nowmark/**", ".github/workflows/nowmark-android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: nowmark
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK packages (runner's preinstalled Android SDK)
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check translations
        run: python3 tools/i18n/generate.py && git diff --exit-code -- app/src/main/res

      - name: Decode upload keystore (if configured)
        env:
          KEYSTORE_B64: ${{ secrets.NOWMARK_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "NOWMARK_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "No signing secret: release outputs will be unsigned."
          fi

      - name: Unit tests, lint, debug APK, release AAB/APK
        env:
          NOWMARK_KEYSTORE_PASSWORD: ${{ secrets.NOWMARK_KEYSTORE_PASSWORD }}
          NOWMARK_KEY_ALIAS: ${{ secrets.NOWMARK_KEY_ALIAS }}
          NOWMARK_KEY_PASSWORD: ${{ secrets.NOWMARK_KEY_PASSWORD }}
          NOWMARK_PLAY_LICENSE_KEY: ${{ secrets.NOWMARK_PLAY_LICENSE_KEY }}
        run: ./gradlew --continue testDebugUnitTest lintDebug assembleDebug bundleRelease assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Surface build errors as annotations
        if: failure()
        run: |
          grep -E "^e: |^w: .*error|: error:|Error: |FAILED|What went wrong|> .*(failed|Could not)|Lint found|\.kt:[0-9]+" "$RUNNER_TEMP/gradle.log" \
            | grep -v "^w: " | head -60 | while IFS= read -r line; do echo "::error::${line//%/%25}"; done
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            grep -A3 "<failure" "$f" 2>/dev/null | head -8 | while IFS= read -r line; do echo "::error::${line//%/%25}"; done
          done
          grep -h -B1 -A2 'severity="Error"' app/build/reports/lint-results-debug.xml 2>/dev/null | grep -E "message=|file=" | head -40 \
            | while IFS= read -r line; do echo "::error::${line//%/%25}"; done

      - name: Release config check (no test ad IDs in release)
        run: |
          set -e
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          unzip -p "$apk" 'classes*.dex' | strings > "$RUNNER_TEMP/dex.txt"
          grep -q "ca-app-pub-9374713455776239/4308791882" "$RUNNER_TEMP/dex.txt"
          if grep -q "ca-app-pub-3940256099942544" "$RUNNER_TEMP/dex.txt"; then
            echo "Test ad unit found in release build"; exit 1
          fi
          echo "Release uses the real ad units only."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nowmark-outputs
          path: |
            nowmark/app/build/outputs/apk/debug/*.apk
            nowmark/app/build/outputs/apk/release/*.apk
            nowmark/app/build/outputs/bundle/release/*.aab
            nowmark/app/build/reports/lint-results-debug.html
            nowmark/app/build/reports/tests/
          if-no-files-found: warn
