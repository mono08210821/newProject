name: Nowmark Android

on:
  push:
    paths: ["nowmark/**", ".github/workflows/nowmark-android.yml"]
  pull_request:
    paths: ["nowmark/**", ".github/workflows/nowmark-android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: nowmark
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check translations
        run: python3 tools/i18n/generate.py && git diff --exit-code -- app/src/main/res

      - name: Decode upload keystore (if configured)
        env:
          KEYSTORE_B64: ${{ secrets.NOWMARK_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "NOWMARK_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "No signing secret: release outputs will be unsigned."
          fi

      - name: Unit tests, lint, debug APK, release AAB/APK
        env:
          NOWMARK_KEYSTORE_PASSWORD: ${{ secrets.NOWMARK_KEYSTORE_PASSWORD }}
          NOWMARK_KEY_ALIAS: ${{ secrets.NOWMARK_KEY_ALIAS }}
          NOWMARK_KEY_PASSWORD: ${{ secrets.NOWMARK_KEY_PASSWORD }}
          NOWMARK_PLAY_LICENSE_KEY: ${{ secrets.NOWMARK_PLAY_LICENSE_KEY }}
        run: ./gradlew --stacktrace testDebugUnitTest lintDebug assembleDebug bundleRelease assembleRelease

      - name: Release config check (no test ad IDs in release)
        run: |
          set -e
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          unzip -p "$apk" classes*.dex | strings | grep -q "ca-app-pub-9374713455776239/4308791882"
          if unzip -p "$apk" classes*.dex | strings | grep -q "ca-app-pub-3940256099942544"; then
            echo "Test ad unit found in release build"; exit 1
          fi
          echo "Release uses the real ad units only."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nowmark-outputs
          path: |
            nowmark/app/build/outputs/apk/debug/*.apk
            nowmark/app/build/outputs/apk/release/*.apk
            nowmark/app/build/outputs/bundle/release/*.aab
            nowmark/app/build/reports/lint-results-debug.html
            nowmark/app/build/reports/tests/
          if-no-files-found: warn
